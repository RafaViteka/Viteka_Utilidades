name: Publish built visual MVP
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Viteka-Utilidades-Windows-preview
          path: installers
          run-id: 40502390343
          github-token: ${{ github.token }}
      - name: Publish tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $files = @(Get-ChildItem installers -Filter '*.exe' -Recurse | ForEach-Object { $_.FullName })
            if ($files.Count -ne 1) { throw 'Expected exactly one built installer' }
            $publishOutput = & gh release upload v0.5.0-preview.1 @files --repo $env:GITHUB_REPOSITORY --clobber 2>&1
            if ($LASTEXITCODE -ne 0) { throw ($publishOutput -join '; ') }
            $publishOutput = & gh release edit v0.5.0-preview.1 --repo $env:GITHUB_REPOSITORY --draft=false --prerelease 2>&1
            if ($LASTEXITCODE -ne 0) { throw ($publishOutput -join '; ') }
          } catch {
            $detail = ($_ | Out-String).Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$detail"
            exit 1
          }
