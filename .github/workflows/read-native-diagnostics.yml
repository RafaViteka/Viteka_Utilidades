name: Read workflow diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Numeric workflow run ID to inspect
        type: string
        required: true
permissions:
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed workflow steps
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$DIAGNOSTIC_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run view "$DIAGNOSTIC_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > native.log
          python - <<'PY'
          from pathlib import Path
          import re
          raw=re.sub(r'\x1b\[[0-9;]*m','',Path('native.log').read_text())
          lines=[line for line in raw.splitlines() if re.search(r'fatal|unhandled|exception|error|failed|hostpolicy|runtime|framework|monitorText',line,re.I)]
          text='\n'.join(lines)[-9000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice::'+text)
          PY
