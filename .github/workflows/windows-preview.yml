name: Windows preview installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, check and package preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File ./scripts/publish-windows.ps1 -BuildInstaller *> build-preview.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $tail = (Get-Content build-preview.log -Tail 35) -join '%0A'
            Write-Output "::error::$tail"
            exit $result
          }
          Get-Content build-preview.log
      - name: HTTP authorization smoke check
        shell: pwsh
        run: |
          $env:VITEKA_DOTNET = (Get-Command dotnet).Source
          python scripts/smoke-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real preview download verification
        shell: pwsh
        run: |
          dotnet run --project tests/Viteka.Core.Checks -c Release --no-build -- --download-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Viteka-Utilidades-Windows-preview
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $tag = "v$version-preview.1"
          $zip = "artifacts/VitekaUtilidades-$version-win-x64-preview.zip"
          Compress-Archive -Path 'artifacts/windows-x64/*' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -Encoding ascii "$zip.sha256"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Viteka Utilidades $version - MVP visual" --notes 'MVP visual: navegacion estilo B con identidad Viteka, catalogo y actividad vacios. Sin utilidades de ejemplo ni conexion real a NixFarma. Instalador sin firma digital; pendiente de revision visual en Windows.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag $zip "$zip.sha256" artifacts/installer/*.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
