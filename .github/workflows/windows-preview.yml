name: Windows preview installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, check and package preview
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -BuildInstaller
      - name: HTTP authorization smoke check
        shell: pwsh
        run: |
          $env:VITEKA_DOTNET = (Get-Command dotnet).Source
          python scripts/smoke-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Viteka-Utilidades-Windows-preview
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14
