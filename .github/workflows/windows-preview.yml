name: Windows preview installer
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate without packaging or publishing a release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, check and package preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File ./scripts/publish-windows.ps1 *> build-preview.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $tail = (Get-Content build-preview.log -Tail 35) -join '%0A'
            Write-Output "::error::$tail"
            exit $result
          }
          Get-Content build-preview.log
      - name: Angular browser checks
        shell: pwsh
        run: |
          python -m pip install -r requirements-ui.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Angular WebView2 integration
        shell: pwsh
        run: |
          try {
            $runtime = Start-Process artifacts/windows-x64/Cliente/Viteka.Desktop.exe -ArgumentList '--check-webview-runtime' -Wait -PassThru
            if ($runtime.ExitCode -ne 0) { ./packaging/windows/prepare-webview.ps1 -Install }
            $directory = New-Item -ItemType Directory -Force artifacts/ui
            $env:VITEKA_UI_SMOKE_REPORT = Join-Path $directory.FullName 'native-report.json'
            $env:VITEKA_UI_SMOKE_SCREENSHOT = Join-Path $directory.FullName 'native-angular.png'
            $process = Start-Process artifacts/windows-x64/Cliente/Viteka.Desktop.exe -ArgumentList '--smoke-ui' -RedirectStandardError (Join-Path $directory.FullName 'native-stderr.log') -PassThru
            if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Native UI test timed out.' }
            if ($process.ExitCode -ne 0) {
              $reportText = Get-Content $env:VITEKA_UI_SMOKE_REPORT -Raw -ErrorAction SilentlyContinue
              $stderrText = Get-Content (Join-Path $directory.FullName 'native-stderr.log') -Raw -ErrorAction SilentlyContinue
              $events = Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error') } | Select-Object -First 2
              throw "Native UI exit=$($process.ExitCode); report=$reportText; stderr=$stderrText; events=$($events.Message -join '; ')"
            }
            if (-not (Test-Path $env:VITEKA_UI_SMOKE_REPORT)) { throw 'Native UI did not produce a report.' }
            $report = Get-Content $env:VITEKA_UI_SMOKE_REPORT -Raw | ConvertFrom-Json
            if (-not $report.passed) { throw "Native UI did not pass: $($report.stage)" }
            Get-Content $env:VITEKA_UI_SMOKE_REPORT
          } catch {
            $detail = $_.Exception.Message
            if ($detail.Length -gt 3500) { $detail = $detail.Substring(0,3500) }
            $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$detail"
            exit 1
          }
      - name: HTTP authorization smoke check
        shell: pwsh
        run: |
          $env:VITEKA_DOTNET = (Get-Command dotnet).Source
          python scripts/smoke-server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real preview download verification
        shell: pwsh
        run: |
          dotnet run --project tests/Viteka.Core.Checks -c Release --no-build -- --download-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile validated Windows installer
        if: ${{ !inputs.validate_only }}
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -InstallerOnly
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.validate_only }}
        with:
          name: Viteka-Utilidades-Windows-preview
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview download
        if: ${{ !inputs.validate_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $tag = "v$version-preview.1"
          $zip = "artifacts/VitekaUtilidades-$version-win-x64-preview.zip"
          Compress-Archive -Path 'artifacts/windows-x64/*' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -Encoding ascii "$zip.sha256"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Viteka Utilidades $version - MVP visual" --notes 'MVP visual: navegacion estilo B con identidad Viteka, catalogo y actividad vacios. Sin utilidades de ejemplo ni conexion real a NixFarma. Instalador sin firma digital; pendiente de revision visual en Windows.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag $zip "$zip.sha256" artifacts/installer/*.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
